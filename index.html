<script>
/* Parseur du questionnaire "Trivia Master" (QPUC).
   Entrée : pages = [{ items: [{ str, x, y }] }]  (coordonnées pdf.js, y vers le haut)
   Sortie : { questions: [...] } */
function parseQuestionnaire(pages) {
  var SECTION_RULES = [
    [/^(9|neuf) points? gagnants?\b/, "neuf"],
    [/^(4|quatre) a la suite\b/, "quatre"],
    [/^jeu decisif\b/, "decisif"],
    [/^face a face\b/, "face"]
  ];
  var THEME_RE = /^Th[eè]me\s*n\s*[°º]?\s*\d/i;
  var diag = { textChars: 0, lines: [], sections: [] };
  var questions = [];
  var section = null, theme = "", themeSrc = "", pendingMeta = "", ptsX = 0, ansX = 0, hasHeader = false;
  var row = null;       // ligne de tableau en cours
  var clue = null;      // énoncé en cours (jeu décisif / face-à-face)
  var faceTheme = "";

  function clean(s) {
    return s.replace(/\*/g, "").replace(/\s+/g, " ").replace(/\s+([?!:;»])/g, " $1").trim();
  }
  function norm(s) {
    return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  }
  function flushRow() {
    if (row && row.q.length && row.a.length) {
      questions.push({
        sec: section, pts: row.pts, theme: theme,
        q: clean(row.q.join(" ")),
        a: clean(row.a.join(" ").replace(/-\s+(?=[A-ZÉÈ])/g, "-")),
        src: clean(row.meta.join(" ")) || (section === "quatre" ? row.themeSrc : "")
      });
    }
    row = null;
  }
  function isMeta(t) { return /·/.test(t); }
  // Certains PDF stockent chaque lettre accentuée comme un morceau de texte séparé.
  // On recolle les morceaux voisins (écart inférieur à une fraction de la taille de police).
  function mergeLine(items) {
    var out = [];
    items.forEach(function (it) {
      var p = out[out.length - 1];
      if (p && typeof p.w === "number" && typeof it.w === "number") {
        var size = p.h || it.h || 10;
        var gap = it.x - (p.x + p.w);
        if (gap < size * 0.15) {
          p.str += it.str;
          p.w = Math.max(p.w, it.x + it.w - p.x);
          return;
        }
      }
      out.push({ str: it.str, x: it.x, y: it.y, w: it.w, h: it.h });
    });
    return out;
  }

  pages.forEach(function (page) {
    // regrouper en lignes
    var items = page.items.map(function (i) {
      return { str: i.str.normalize("NFC").replace(/[   ]/g, " "), x: i.x, y: i.y, w: i.w, h: i.h };
    }).filter(function (i) { return i.str.trim() !== ""; })
      .sort(function (a, b) { return b.y - a.y || a.x - b.x; });
    var lines = [];

uipe de France, surnommé Titi.","a":"Thierry Henry","o":"Émission TV · 13 mai 2024"},{"s":"decisif","p":0,"t":"","q":"Que suis-je ? A l'écran sous le nom de Célestine j'ai eu les traits de Paulette Godard, Jeanne Moreau et Léa Seydoux. Mon journal a été publié en 1900 par Octave Mirbeau. Métier féminin synonyme de domestique, je suis aujourd'hui surtout employée dans l'hôtellerie","a":"Une Femme de chambre","o":"CRAG · Vienne · 26 avr. 2025"},{"s":"decisif","p":0,"t":"","q":"Qui suis-je ? Scientifique américaine. Née en 19...","a":"Dian Fossey","o":"Émission TV · 30 nov. 2022"},{"s":"decisif","p":0,"t":"","q":"Que suis-je ? Année surmontant les initiales d'Albrecht Dürer dans l'un de ses autoportraits, j'ai été marquée par la découverte du Brésil par Pedro Cabral et la naissance de Charles Quint. Année constituant la dernière du XVe siècle","a":"1500","o":"Karim · Dijon · 1 janv. 2024"},{"s":"decisif","p":0,"t":"","q":"Qui suis-je ? Un chanteur né en 1935, terminant 5e de l'Eurovision 1963 avec 'Elle était si jolie'.","a":"Alain Barrière","o":"Émission TV · 9 avr. 2015"},{"s":"decisif","p":0,"t":"","q":"Que suis-je ? Engin volant, je suis plus lourd que l’air. Habituellement manœuvré ou simplement rattaché au sol à l’aide d’un ou plusieurs fils, fabriqué avec de la toile et une armature rigide, j’ai causé la mort de Benjamin Franklin,","a":"LE CERF-VOLANT","o":"Sylvain · Grasse · 1 févr. 2016"},{"s":"face","p":0,"t":"Animaux (70 mots)","q":"Mammifère dont on compte une vingtaine d'espèces, je suis originaire du Brésil, entre le Rio Madeira et le Rio Xingu. Comptant parmi mes prédateurs le petit-duc, le margay et le chat-ocelot, je me nourris de la gomme de certains arbres. Monogame uniquement en captivité, j'appartiens essentiellement au genre Callitrix, d'où mon autre nom. Primate pesant entre 120 et 400 grammes, portant un nom signifiant qui vient de l'humain, je suis…","a":"Le callitriche / Le marmouset / Le ouistiti","o":"Malaunay · Malaunay · 30 mars 2025"},{"s":"face","p":0,"t":"Histoire (71 mots)","q":"Paquebot prestigieux lancé en 1937, Hitler lui donne le nom d’un activiste du Parti Nazi assassiné par un étudiant juif l’année précédente. En janvier (19)45, transportant des milliers de civils allemands fuyant l’avancée des troupes russes, je suis torpillé par un sous-marin soviétique provoquant ce qui est sans doute la plus grande catastrophe maritime de tous les temps avec quelque 8000 morts et je suis …","a":"Le WILHELM GÜSTLOFF","o":"Robert · Blaye · 27 sept. 2015"},{"s":"face","p":0,"t":"Architecture (69 mots)","q":"Établissement fondé à la fin de la guerre de Cent Ans, je compte plusieurs salles dont la salle des « Pôvres » ou celle du Jugement dernier. Ma construction est initiée par Nicolas Rolin. J’apparais dans plusieurs scènes de La Grande Vadrouille de Gérard Oury. Ma façade est austère, mais on peut admirer mes toits en tuiles vernissées. Situé en Côte-d’Or, reconnu pour mes ventes annuelles de vins d’exception","a":"Les Hospices de Beaune","o":"Tournoi · Lyon-Ville · 1 oct. 2019"},{"s":"face","p":0,"t":"Sciences et Techniques (75 mots)","q":"Dispositif dont la forme basique est un cube de dix centimètres de côté, je ne dois pas excéder deux kilogrammes, selon un cahier des charges établi par des universités américaines. La juxtaposition de plusieurs de ces unités cubiques permet de réduire les coûts de lancement, dans le domaine de l’observation de la Terre. Format de satellite artificiel, je porte un nom valise anglais lié à ma forme, alors qu’en français mon préfixe grec signifie ‘milliardième’.","a":"Un nanosatellite ou CubeSat","o":"Tournoi · Le Mans · 8 mars 2025"},{"s":"face","p":0,"t":"Personnalités (72 mots)","q":"Prénom porté par une journaliste de l'émission parodique Importantissime, je suis le nom d'une poétesse grecque et celui d'une chanteuse qui remet au goût du jour le disco quand je ne comprends qu'un seul n. Proposé dans l'émission Les Terriens du dimanche par Eric Zemmour pour rebaptiser Hapsatou Sy, je suis le prénom de l'actrice interprétant le commissaire Marleau et dont le patronyme est Masiero. Parfois abrégé en Coco, je suis …","a":"CORINNE","o":"Tournoi · Rennes · 1 oct. 2002"},{"s":"face","p":0,"t":"Biologie (67 mots)","q":"Plante à fleurs de la famille des Astéracées, du genre Tragopogon, je suis parfois appelée barbe de bouc. Je suis cultivée pour ma racine riche en inuline, mes inflorescences sont des capitules groupant des fleurs violettes. Présentant un goût légèrement sucré, je suis consommée crue ou cuite, en salade, sautée ou avec de la sauce béchamel. Parfois confondue avec le scorsonère, mon nom vient de l'italien salsefica","a":"Le salsifis","o":"Tournoi · Valence · 1 juil. 2024"},{"s":"face","p":0,"t":"Sport (76 mots)","q":"Tennisman né en février 1972 à Hoboken dans le New Jersey, j’ai remporté trente-quatre titres du circuit ATP entre 1988 et 2003 ainsi qu’une coupe Davis en 1990. Droitier doté d’un formidable jeu de jambes, j’ai atteint la seconde place mondiale du classement ATP le 9 septembre 1996. Fils d’immigrants chinois, ma carrière a été marquée par ma victoire à Roland-Garros en 1989 à l’âge de 17 ans, je suis…","a":"Michael Chang","o":"Franck · Malaunay · 9 avr. 2023"},{"s":"face","p":0,"t":"Musique (69 mots)","q":"Poème symphonique dont l'exécution dure environ douze minutes, je suis un programme avec voix souterraines, apparition des esprits des ténèbres, sonnerie de la cloche du village et aube naissante. Utilisé avec l'Ave Maria de Schubert, dans la dernière séquence de Fantasia, de Walt Disney, je suis inspiré d'une nouvelle de Nicolas Gogol, La Nuit de la Saint-Jean, qui met en scène le sabbat des sorcières. Écrit par Modeste Moussorgski,","a":"Une nuit sur le mont Chauve","o":"Jacques · Eybens-Grenoble · 23 juin 2024"},{"s":"face","p":0,"t":"Culture Générale (77 mots)","q":"Nom utilisé en mathématiques dans la théorie des probabilités, je corresponds aussi à un rang taxonomique situé entre la famille et le genre. Dans l'Antiquité, j'étais une division de la cité regroupant des personnes de la même famille, et pour les Juifs je suis associé à chacun des douze fils de Jacob. Employé par les ethnologues pour désigner des peuples de sociétés dites primitives, je désigne parfois un groupe de personnes partageant les mêmes intérêts. Je suis...","a":"TRIBU","o":"Tournoi de Rennes 2025 · Rennes · 23 nov. 2025"},{"s":"face","p":0,"t":"Télévision (84 mots)","q":"Émission de télévision diffusée de 1975 à 1990, j'ai le même générique qu'Histoires Naturelles et Georges Brassens a toujours refusé d'y participer. Parodiée par les Inconnus ou les Guignols qui se moquaient de mon côté sérieux, celle ayant pour thème « la Chine après Mao » a été censurée. Émission axée sur la littérature, la culture et les arts, j'ai accueilli Sartre, Duras, Brel et Sagan entre autres. Présentée par Bernard Pivot, je porte le nom d'un signe de ponctuation, je suis…","a":"Apostrophes","o":"Tournoi · LYON-VILLE · 1 juin 2024"},{"s":"face","p":0,"t":"Art (89 mots)","q":"Peintre, dessinateur et graveur, après des natures mortes et des portraits aux coloris délicats je choisis une gamme chromatique plus vive proche de celle des impressionnistes et traite la plupart de mes thèmes – masques, carnavals, squelettes – avec une ironie désabusée. La liberté avec laquelle j’use des couleurs et l’expressivité que je donne à mes personnages fait de moi un précurseur de l’expressionnisme. En 1889, mon tableau l’Entrée du Christ à Bruxelles est refusé au salon des XX. De nationalité belge, mort en 1949, je suis…","a":"Ensor (James)","o":"Tournoi de Paris 1 · Paris 1 · 1 oct. 2007"},{"s":"face","p":0,"t":"Mathématiques (84 mots)","q":"Nombre premier inférieur à cent, je suis le numéro porté par le pape Jean du 11° siècle, entre Benoît VIII et Benoît IX , je suis le nombre d'années de mariage où l'on fête les noces de cretonne , je suis la racine carrée de 361 et le numéro atomique du potassium , je suis le cinquième de 95 , mon siècle a vu l'apogée du Romantisme , je correspond au département de la Creuse et suis égal à 18 + 1, je suis","a":"19","o":"Auch · Auch · 1 janv. 2014"}] };

    if (S.qe && t && t.getAttribute && t.getAttribute("data-qi") != null) S.qe.cur = { i: +t.getAttribute("data-qi"), f: t.getAttribute("data-qf"), pos: t.selectionStart };
  }
  ["click", "keyup", "select", "focusout", "touchend"].forEach(function (ev) { app.addEventListener(ev, trackCursor, true); });
  app.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "fren") { e.preventDefault(); var b = app.querySelector('[data-act="fren-ok"]'); if (b) b.click(); }
    else if (e.target.id === "ed-name" || e.target.id === "ed-nf") { e.preventDefault(); saveEdit(); }
  });
  document.addEventListener("dragover", function (e) { if (S.view !== "home") return; e.preventDefault(); var d = document.getElementById("drop"); if (d) d.classList.add("over"); });
  document.addEventListener("dragleave", function (e) { var d = document.getElementById("drop"); if (d && !e.relatedTarget) d.classList.remove("over"); });
  document.addEventListener("drop", function (e) {
    if (S.view !== "home") return;
    e.preventDefault(); var d = document.getElementById("drop"); if (d) d.classList.remove("over");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.zoom) { S.zoom = null; render(); return; }
    if (S.view !== "play") return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (!S.shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); S.shown = true; render(); }
    else if (S.shown && (e.key === "ArrowRight" || e.key === "t")) { answer(true); }
    else if (S.shown && (e.key === "ArrowLeft" || e.key === "r")) { answer(false); }
    else if (e.key === "ArrowUp" || e.key === "b") { e.preventDefault(); back(); }
  });
  // la partie est enregistrée à chaque réponse ; on force aussi l'envoi au compte quand la page se cache
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { S.decks.forEach(function (d) { if (!d.builtin && d.dirty && !d.synced && DB.coll && DB.ready && !S.up[d.id]) pushDecks([d]); }); saveSessionsLocal(); if (S.sess && SESS[S.sess.deck]) scheduleSessionSync(S.sess.deck, 0); }
  });
  window.addEventListener("pagehide", function () { saveSessionsLocal(); });

  S.multi = Math.max(1, Math.min(50, parseInt(lsGet(K3 + "multi"), 10) || 1));
  loadSaved().then(function () { render(); initSync(); }, function () { render(); initSync(); });
})();

</script>
