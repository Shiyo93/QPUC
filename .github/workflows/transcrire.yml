name: Transcrire les vidéos
on:
  push:
    paths: ["videos.txt"]
  workflow_dispatch:
    inputs:
      refaire:
        description: "Refaire même les vidéos déjà traitées (oui/non)"
        default: "non"
permissions:
  contents: write
jobs:
  transcrire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-fra
          pip install -q yt-dlp faster-whisper
      - name: Traiter les vidéos
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          FORCE: ${{ github.event.inputs.refaire == 'oui' && '1' || '' }}
        run: python tools/transcrire.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "transcription-bot"
          git config user.email "bot@users.noreply.github.com"
          git add transcriptions
          git diff --cached --quiet || git commit -m "Transcriptions des vidéos"
          git pull --rebase -q
          git push
