<style>
/* Plan de travail quadrillé, rectangles blancs à entête teintée, liens en traits fins. */
:root{
  --bg:#eef1f5; --grid:#d3dae4; --card:#ffffff; --fg:#14202e; --muted:#5b6b7e;
  --line:#7d8a9c; --accent:#2b5fd9; --accent-fg:#ffffff; --bar:#ffffff; --border:#cfd6e0; --danger:#b3261e;
  --c0:#2b5fd9; --c1:#1f8a5b; --c2:#b7791f; --c3:#c2417a; --c4:#7a4fd0; --c5:#51606f;
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1620; --grid:#1d2836; --card:#18222f; --fg:#e6ecf4; --muted:#93a3b8;
    --line:#6c7a8e; --accent:#6f95ff; --accent-fg:#0b1220; --bar:#18222f; --border:#2c3a4c; --danger:#ff8a80;
    --c0:#6f95ff; --c1:#4cc491; --c2:#e0a74a; --c3:#ee7fb0; --c4:#a58af0; --c5:#9aa8b8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1620; --grid:#1d2836; --card:#18222f; --fg:#e6ecf4; --muted:#93a3b8;
  --line:#6c7a8e; --accent:#6f95ff; --accent-fg:#0b1220; --bar:#18222f; --border:#2c3a4c; --danger:#ff8a80;
  --c0:#6f95ff; --c1:#4cc491; --c2:#e0a74a; --c3:#ee7fb0; --c4:#a58af0; --c5:#9aa8b8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px);background-size:24px 24px;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#lines .hit{stroke:transparent;stroke-width:22;fill:none;pointer-events:stroke;cursor:pointer}
#lines .ln{stroke:var(--line);stroke-width:2;fill:none}
#lines .ln.ref{stroke-dasharray:6 5;stroke-width:1.6}
#lines text{font:500 12px var(--f-body);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;text-anchor:middle;pointer-events:none}
.top{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5;
  font:700 17px var(--f-display);letter-spacing:.01em;pointer-events:none}
.top small{display:block;font:400 12px var(--f-body);color:var(--muted);letter-spacing:0}
.box{position:absolute;width:236px;background:var(--card);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 1px 0 var(--border),0 6px 18px rgba(10,20,40,.08);cursor:default}
.box.pick{outline:3px solid var(--accent);outline-offset:3px}
.bh{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px;border-radius:7px 7px 0 0;
  background:color-mix(in srgb,var(--cx) 16%,var(--card));border-bottom:1px solid color-mix(in srgb,var(--cx) 40%,var(--border));touch-action:none;cursor:grab}
.bh .t{flex:1;min-width:0;font:700 15px/1.2 var(--f-display);overflow-wrap:anywhere}
.ib{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:6px;color:var(--muted)}
.ib:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grip{color:var(--cx)}
.items{list-style:none;margin:0;padding:4px 0}
.it{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 10px 5px calc(10px + var(--lv)*16px);position:relative}
.it:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.it .r1{display:flex;gap:7px;align-items:baseline}
.it .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line);transform:translateY(-1px)}
.it.fiche .dot{width:9px;height:9px;border-radius:2px;background:var(--cx)}
.it .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.it .d{font:400 12px var(--f-mono);color:var(--muted);margin-left:auto;padding-left:6px;white-space:nowrap}
.it .s{margin:2px 0 0 16px;font-size:13px;color:var(--muted)}
.it .go{margin:3px 0 0 16px;font:500 12px var(--f-body);color:var(--cx)}
.add{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px dashed var(--border);background:transparent;
  padding:8px 10px;color:var(--muted);font-size:13px;border-radius:0 0 7px 7px}
.add:hover{color:var(--fg)}
.add svg{width:16px;height:16px;stroke:var(--cx);fill:none;stroke-width:2.4;stroke-linecap:round}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding:8px max(10px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.bar .in{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;background:var(--bar);border:1px solid var(--border);
  border-radius:12px;padding:4px;box-shadow:0 6px 24px rgba(10,20,40,.14);max-width:100%}
.bt{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 12px;border:0;background:transparent;border-radius:8px;font-weight:500;font-size:14px}
.bt:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.bt svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bt.on{background:var(--accent);color:var(--accent-fg)}
.bt.p{background:var(--accent);color:var(--accent-fg)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:6;max-width:calc(100% - 32px);
  background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;text-align:center}
.ex{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;
  display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 8px 8px 12px;font-size:13px;color:var(--muted);max-width:420px}
.ex span{flex:1}
.shade{position:fixed;inset:0;z-index:9;background:rgba(8,14,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:14px 14px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-right,0px))}
.sheet h2{margin:0 0 12px;font:700 18px var(--f-display)}
.fl{display:block;margin:10px 0 4px;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fi{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea.fi{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sb{min-height:42px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-weight:500}
.sb.p{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sb.d{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--border))}
.sb.d.arm{background:var(--danger);color:var(--card);border-color:var(--danger)}
.sb[disabled]{opacity:.4}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--border)}
.sw button.on{box-shadow:0 0 0 3px var(--fg)}
.sp{flex:1}
.mv{display:flex;gap:6px}
.mv .sb{width:46px;padding:0;display:grid;place-items:center}
.mv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.tb{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.tb>*{pointer-events:auto}
.tb .mn{background:var(--bar);border:1px solid var(--border);width:40px;height:40px;border-radius:10px;color:var(--fg)}
.tt{flex:1;min-width:0;font:700 16px/1.15 var(--f-display);pointer-events:none}
.tt small{display:block;font:400 11px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:var(--bar);font-weight:500;font-size:13px;max-width:48%;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.loc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.box.dim{display:none}
.side{position:fixed;left:0;top:0;bottom:0;z-index:8;width:min(310px,88vw);background:var(--bar);border-right:1px solid var(--border);display:flex;flex-direction:column;
  transform:translateX(-103%);visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.side.open{transform:none;visibility:visible;box-shadow:0 0 40px rgba(10,20,40,.28)}
.sh{display:flex;align-items:center;gap:4px;padding:10px 8px 6px 14px}
.sh b{flex:1;font:700 16px var(--f-display)}
.sq{width:auto;margin:0 12px 8px}
.tree{flex:1;overflow:auto;padding:0 6px 12px}
.trow{display:flex;align-items:center}
.trow .fo,.trow .no{flex:1;min-width:0}
.trow .ib{width:34px;height:34px}
.fo,.no{display:flex;align-items:center;gap:7px;min-height:40px;padding:0 6px 0 calc(8px + var(--d)*16px);border:0;background:transparent;border-radius:6px;text-align:left;font:inherit}
.fo{font-weight:600;color:var(--muted)}
.fo svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fo.shut svg{transform:rotate(-90deg)}
.no .sq2{width:9px;height:9px;border-radius:2px;flex:none;background:var(--cx)}
.no.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600}
.fo:hover,.no:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.side-add{display:flex;gap:6px;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid var(--border)}
.side-add .sb{flex:1}
.back{position:fixed;inset:0;z-index:7;background:rgba(8,14,24,.4)}
@media (prefers-reduced-motion:no-preference){.box{transition:box-shadow .15s}.side{transition:transform .2s,visibility .2s}}
.keys{display:none;padding:10px 14px;font-size:12px;line-height:1.9;color:var(--muted);border-top:1px solid var(--border)}
kbd{font:500 11px var(--f-mono);padding:1px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;background:var(--bg);color:var(--fg)}
@media (min-width:700px){
  .shade{align-items:center}
  .sheet{border-radius:14px;max-height:90%;max-width:560px;padding-bottom:16px}
}
@media (min-width:900px){
  .side{transform:none!important;visibility:visible!important;width:300px;box-shadow:none}
  .back{display:none!important}
  #b-menu{display:none}
  #view{left:300px}
  .tb{left:316px}
  .bar{left:300px}
  .ex{left:316px}
  .hint{left:calc(50% + 150px)}
  .keys{display:block}
  .bh{cursor:grab}
  .bh:active{cursor:grabbing}
  #s-x{display:none}
}
@media (max-width:480px){
  .bar .in{flex-wrap:nowrap}
  .bt{padding:0 9px;gap:5px;font-size:13px}
  .bt[aria-label]{padding:0;width:38px;justify-content:center}
}
</style>

<script>window.GH_SYNC=true</script>
<div id="view"><div id="world"><svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg><div id="boxes"></div></div></div>

</div></div>

<script>
var $=function(i){return document.getElementById(i)};
var IC={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  pen:'<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  grip:'<svg viewBox="0 0 24 24" style="stroke-width:3.6"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  focus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>'
};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var dist=function(a,b){return Math.hypot(a.x-b.x,a.y-b.y)};
var LS='carte-savoirs-v1';
var S={boxes:[],links:[],folders:[],seen:false};
var mode='global',focus='',localK=1;
var V={x:20,y:90,k:1};
var boxEls={};
var linkMode=false,linkFrom=null;
var viewEl=$('view'),worldEl=$('world'),boxesEl=$('boxes'),linesEl=$('lines');

function I(t,d,s,lv,ref){return {id:uid(),t:t,d:d||'',s:s||'',lv:lv||0,ref:ref||''}}
function seed(){
  return {seen:false,links:[],folders:[{id:'hist',t:'Histoire',p:'',open:true}],boxes:[
    {id:'rois',t:'Rois de France',c:0,f:'hist',x:0,y:150,fold:false,items:[
      I('Mérovingiens','481-751','Dynastie fondée par Clovis.'),
      I('Carolingiens','751-987','De Pépin le Bref à Louis V.'),
      I('Capétiens directs','987-1328'),
      I('Valois','1328-1589','Guerre de Cent Ans puis Renaissance.'),
      I('François Ier','1515-1547','',1,'fran'),
      I('Bourbons','1589-1830','D’Henri IV à Charles X.'),
      I('Louis XIV','1643-1715','',1,'louis')]},
    {id:'louis',t:'Louis XIV',c:2,f:'hist',x:330,y:0,fold:false,items:[
      I('Épouses'),
      I('Marie-Thérèse d’Autriche','1638-1683','Épouse officielle, infante d’Espagne.',1),
      I('Madame de Maintenon','1635-1719','Épouse secrète à partir de 1683 environ.',1),
      I('Hommes d’État'),
      I('Colbert','1619-1683','Finances et marine.',1),
      I('Louvois','1641-1691','Secrétaire d’État à la Guerre.',1),
      I('Vauban','1633-1707','Fortifications, maréchal.',1),
      I('Rivaux'),
      I('Guillaume III d’Orange','1650-1702','Stathouder puis roi d’Angleterre.',1),
      I('Léopold Ier','1640-1705','Empereur du Saint-Empire.',1)]},
    {id:'fran',t:'François Ier',c:1,f:'hist',x:330,y:700,fold:false,items:[
      I('Bataille de Marignan','1515','Victoire sur les Suisses.'),
      I('Henri VIII','1491-1547','Rival anglais, roi d’Angleterre de 1509 à 1547.'),
      I('Charles Quint','1500-1558','Rival Habsbourg, empereur à partir de 1519.')]}
  ]};
}
function boxById(id){for(var i=0;i<S.boxes.length;i++)if(S.boxes[i].id===id)return S.boxes[i];return null}

/* ---------- sauvegarde ---------- */
var ref=null,saveT=null,saving=false,dirty=false,online=false;
var gstate='',gcode='',ghSha=null,ghDirty=false,ghBusy=false,ghT=null;
function status(){
  var n=0;S.boxes.forEach(function(b){b.items.forEach(function(i){if(i.d||i.s)n++})});
  var where=online?'enregistré en ligne':'enregistré sur cet appareil';
  if(window.GH_SYNC&&ghCfg()){
    where=gstate==='ok'?'synchronisé avec GitHub':gstate==='err'?'erreur de synchro'+(gcode?' ('+gcode+')':''):'synchronisation…';
  }
  $('sub').textContent=S.boxes.length+' rectangles · '+n+' fiches · '+where;
}
function persist(){
  S.at=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  status();
  if(window.GH_SYNC&&ghCfg()){ghDirty=true;clearTimeout(ghT);ghT=setTimeout(ghPush,3000)}
  if(!ref)return;

function rectOf(b){var el=boxEls[b.id];return {x:b.x,y:b.y,w:el?el.offsetWidth:236,h:el?el.offsetHeight:120}}
function edge(r,tx,ty){
  var cx=r.x+r.w/2,cy=r.y+r.h/2,dx=tx-cx,dy=ty-cy;
  if(!dx&&!dy)return {x:cx,y:cy};
  var s=Math.min(dx?(r.w/2)/Math.abs(dx):1e9,dy?(r.h/2)/Math.abs(dy):1e9);
  return {x:cx+dx*s,y:cy+dy*s};
}
function pairs(){
  var ps=[];
  S.links.forEach(function(l){ps.push({a:l.a,b:l.b,l:l.l,id:l.id,ref:false})});
  S.boxes.forEach(function(b){b.items.forEach(function(it){
    if(!it.ref||it.ref===b.id||!boxById(it.ref))return;
    var dup=ps.some(function(p){return (p.a===b.id&&p.b===it.ref)||(p.a===it.ref&&p.b===b.id)});
    if(!dup)ps.push({a:b.id,b:it.ref,ref:true});
  })});
  return ps;
}

function lines(){
  var out='';

    var A=boxById(p.a),B=boxById(p.b);if(!A||!B||!shown(p.a)||!shown(p.b))return;
    var ra=rectOf(A),rb=rectOf(B);
    var pa=edge(ra,rb.x+rb.w/2,rb.y+rb.h/2),pb=edge(rb,ra.x+ra.w/2,ra.y+ra.h/2);
    var d='M'+pa.x.toFixed(1)+' '+pa.y.toFixed(1)+'L'+pb.x.toFixed(1)+' '+pb.y.toFixed(1);
    out+='<path class="ln'+(p.ref?' ref':'')+'" d="'+d+'"/>';
    if(!p.ref){
      out+='<path class="hit" data-l="'+p.id+'" d="'+d+'"/>';
      if(p.l)out+='<text x="'+((pa.x+pb.x)/2).toFixed(1)+'" y="'+((pa.y+pb.y)/2+4).toFixed(1)+'">'+esc(p.l)+'</text>';

function fit(){
  if(!S.boxes.length){V={x:20,y:90,k:1};apply();return}
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  S.boxes.forEach(function(b){var r=rectOf(b);x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h)});
  var W=viewEl.clientWidth,H=viewEl.clientHeight;
  var k=clamp(Math.min((W-40)/(x1-x0),(H-170)/(y1-y0),1.1),.25,1.1);

}
function zoomAt(cx,cy,k,base){
  var b=base||V,wx=(cx-b.x)/b.k,wy=(cy-b.y)/b.k;

var ptrs={},pan=null,pinch=null,drag=null;

  var bh=e.target.closest('.bh');

  }

  if(ids.length===1){pan={sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y,moved:false,t:e.target}}
  else if(ids.length===2){
    var a=ptrs[ids[0]],c=ptrs[ids[1]];pan=null;
    var vr=viewEl.getBoundingClientRect();
    pinch={d:dist(a,c)||1,k:V.k,cx:(a.x+c.x)/2-vr.left,cy:(a.y+c.y)/2-vr.top,x:V.x,y:V.y};
  }
});
window.addEventListener('pointermove',function(e){
  if(drag){
    var dx=(e.clientX-drag.sx)/V.k,dy=(e.clientY-drag.sy)/V.k;
    if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
    drag.b.x=Math.round(drag.ox+dx);drag.b.y=Math.round(drag.oy+dy);place(drag.el,drag.b);lines();return;
  }
  if(!ptrs[e.pointerId])return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(pinch&&ids.length>=2){
    zoomAt(pinch.cx,pinch.cy,clamp(pinch.k*dist(ptrs[ids[0]],ptrs[ids[1]])/pinch.d,.25,2.5),{x:pinch.x,y:pinch.y,k:pinch.k});chkZoom();return;
  }
  if(pan){
    var mx=e.clientX-pan.sx,my=e.clientY-pan.sy;
    if(Math.abs(mx)+Math.abs(my)>5)pan.moved=true;
    V.x=pan.vx+mx;V.y=pan.vy+my;apply();
  }
});

  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  [focus].concat(neighbors(focus)).forEach(function(i){
    var bb=boxById(i);if(!bb)return;var r=rectOf(bb);
    x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h);
  });
  var W=viewEl.clientWidth,H=viewEl.clientHeight,k=clamp(Math.min((W-32)/(x1-x0),(H-150)/(y1-y0),1),.6,1);
  var r0=rectOf(b);
  V.k=k;localK=k;
  V.x=(x1-x0)*k<=W-24?(W-(x1-x0)*k)/2-x0*k:W/2-(r0.x+r0.w/2)*k;
  V.y=(y1-y0)*k<=H-130?(H-(y1-y0)*k)/2-y0*k+10:64-r0.y*k;
  apply();saveView();
}
function chkZoom(){if(mode==='local'&&V.k<localK*.75){mode='global';render()}}
$('b-mode').onclick=function(){
  if(mode==='local')setGlobal();
  else if(focus&&boxById(focus))focusLocal(focus);
  else{say('Touche le titre d’un rectangle pour le voir de près.');setTimeout(function(){say('')},2800)}
};

/* ---------- panneau latéral ---------- */
var sideOpen=false;
function side(o){sideOpen=o;$('side').classList.toggle('open',o);$('back').hidden=!o}
function folderById(id){return S.folders.filter(function(f){return f.id===id})[0]||null}
function noteRow(b,d){
  return '<div class="trow"><button class="no'+(mode==='local'&&focus===b.id?' cur':'')+'" type="button" style="--d:'+d+';--cx:var(--c'+b.c+')" data-n="'+b.id+'"><i class="sq2"></i><span>'+esc(b.t)+'</span></button></div>';
}
function renderTree(){
  var q=($('s-q').value||'').trim().toLowerCase(),h='';
  if(q){
    S.boxes.forEach(function(b){if(b.t.toLowerCase().indexOf(q)>-1)h+=noteRow(b,0)});
    $('tree').innerHTML=h||'<p class="note" style="padding:8px 10px">Aucune note trouvée.</p>';return;
  }
  var walk=function(pid,d){
    S.folders.forEach(function(f){
      if((f.p||'')!==pid)return;
      h+='<div class="trow"><button class="fo'+(f.open?'':' shut')+'" type="button" style="--d:'+d+'" data-f="'+f.id+'">'+IC.chev+'<span>'+esc(f.t)+'</span></button>'
       +'<button class="ib" type="button" data-fe="'+f.id+'" aria-label="Modifier le dossier">'+IC.pen+'</button></div>';
      if(f.open){walk(f.id,d+1);S.boxes.forEach(function(b){if(b.f===f.id)h+=noteRow(b,d+1)})}
    });
  };
  walk('',0);
  S.boxes.forEach(function(b){if(!b.f||!folderById(b.f))h+=noteRow(b,0)});
  $('tree').innerHTML=h||'<p class="note" style="padding:8px 10px">Rien pour l’instant. Ajoute un dossier ou une note.</p>';
}
function isUnder(fid,pid){
  for(var f=folderById(fid),n=0;f&&n<50;n++,f=folderById(f.p)){if(f.id===pid)return true}
  return false;
}
function folderSheet(fid,isNew){
  var f=folderById(fid);
  var opts=S.folders.filter(function(x){return !isUnder(x.id,fid)}).map(function(x){return '<option value="'+x.id+'"'+(f.p===x.id?' selected':'')+'>'+esc(x.t)+'</option>'}).join('');
  openSheet('<h2>'+(isNew?'Nouveau dossier':'Modifier le dossier')+'</h2>'
   +'<label class="fl" for="f-t">Nom</label><input class="fi" id="f-t" value="'+esc(f.t)+'" autocomplete="off">'
   +'<label class="fl" for="f-p">Placé dans</label><select class="fi" id="f-p"><option value="">Racine</option>'+opts+'</select>'
   +'<div class="row"><button class="sb p" id="f-ok" type="button">Enregistrer</button><button class="sb" id="f-no" type="button">Annuler</button><span class="sp"></span>'
   +(isNew?'':'<button class="sb d" id="f-del" type="button">Supprimer</button>')+'</div>'
   +(isNew?'':'<p class="note">Supprimer un dossier garde ses notes : elles remontent d’un niveau.</p>'));
  var kill=function(){
    S.folders=S.folders.filter(function(x){return x.id!==fid});
    S.folders.forEach(function(x){if(x.p===fid)x.p=f.p||''});
    S.boxes.forEach(function(b){if(b.f===fid)b.f=f.p||''});
    persist();renderTree();closeSheet();
  };
  $('f-no').onclick=function(){if(isNew){S.folders=S.folders.filter(function(x){return x.id!==fid});persist();renderTree()}closeSheet()};
  armDelete('f-del',kill);
  $('f-ok').onclick=function(){f.t=val('f-t').trim()||'Sans nom';f.p=val('f-p');f.open=true;persist();renderTree();closeSheet()};
  $('f-t').focus();if(isNew)$('f-t').select();
}
function wireLinks(bid){
  var list=function(){
    var mine=S.links.filter(function(l){return l.a===bid||l.b===bid}),h='';
    var linked={};
    mine.forEach(function(l){
      var o=boxById(l.a===bid?l.b:l.a);if(!o)return;linked[o.id]=1;
      h+='<div class="row" style="margin:4px 0"><span style="flex:1;min-width:0;overflow-wrap:anywhere">'+esc(o.t)+(l.l?' <span class="note">('+esc(l.l)+')</span>':'')+'</span><button class="sb d" type="button" data-rl="'+l.id+'">Retirer</button></div>';
    });
    $('f-ln').innerHTML=h||'<p class="note" style="margin:0">Aucun lien direct.</p>';
    $('f-add').innerHTML='<option value="">Relier à…</option>'+S.boxes.filter(function(o){return o.id!==bid&&!linked[o.id]}).map(function(o){return '<option value="'+o.id+'">'+esc(o.t)+'</option>'}).join('');
  };
  list();
  $('f-ln').onclick=function(e){
    var x=e.target.closest('[data-rl]');if(!x)return;
    S.links=S.links.filter(function(l){return l.id!==x.dataset.rl});persist();render();list();
  };
  $('f-addb').onclick=function(){
    var o=val('f-add');if(!o)return;
    S.links.push({id:uid(),a:bid,b:o,l:''});persist();render();list();
  };
}
$('tree').addEventListener('click',function(e){
  var f=e.target.closest('[data-f]'),fe=e.target.closest('[data-fe]'),n=e.target.closest('[data-n]');
  if(f){var o=folderById(f.dataset.f);o.open=!o.open;persist();renderTree()}
  else if(fe)folderSheet(fe.dataset.fe,false);
  else if(n){side(false);focusLocal(n.dataset.n)}
});
$('s-q').oninput=renderTree;
$('b-menu').onclick=function(){side(!sideOpen)};
$('s-x').onclick=function(){side(false)};
$('back').onclick=function(){side(false)};
$('s-nf').onclick=function(){
  var f={id:uid(),t:'Nouveau dossier',p:'',open:true};S.folders.push(f);persist();renderTree();folderSheet(f.id,true);
};
$('s-nn').onclick=function(){side(false);newBox(false)};
viewEl.addEventListener('dblclick',function(e){
  if(e.target.closest('.box')||e.target.closest('.hit'))return;
  var r=viewEl.getBoundingClientRect();
  newBox(false,{x:(e.clientX-r.left-V.x)/V.k-118,y:(e.clientY-r.top-V.y)/V.k-20});
});
window.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
  if(e.key==='Escape'){
    if(!shade.hidden)closeSheet();else if(linkMode)endLink();else if(sideOpen)side(false);
    return;
  }
  if(typing||!shade.hidden)return;
  var k=e.key.toLowerCase();
  if(k==='n'){e.preventDefault();newBox(true)}
  else if(k==='l')$('b-link').click();
  else if(k==='f')$('b-fit').click();
  else if(k==='g')$('b-mode').click();
  else if(k==='+'||k==='=')$('b-in').click();
  else if(k==='-')$('b-out').click();
  else if(k==='/'){e.preventDefault();side(true);$('s-q').focus()}
});

/* ---------- synchronisation GitHub (version hébergée) ---------- */
var GHK='carte-gh',ghTry=0;
function ghCfg0(){try{return JSON.parse(localStorage.getItem(GHK))}catch(e){return null}}
function ghCfg(){var c=ghCfg0();return c&&c.token&&c.repo&&c.path?c:null}
function b64e(s){var b=new TextEncoder().encode(s),r='';for(var i=0;i<b.length;i+=8192)r+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(r)}
function b64d(s){var r=atob(s.replace(/\s/g,'')),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)}
function setG(s,c){gstate=s;gcode=c||'';status()}
function ghUrl(c){return 'https://api.github.com/repos/'+c.repo+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')}
function ghHead(c){return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}}
async function ghPush(){
  var c=ghCfg();if(!c||ghBusy||!ghDirty)return;
  ghBusy=true;ghDirty=false;setG('busy');
  try{
    var body={message:'Carte des savoirs '+new Date().toISOString().slice(0,16),content:b64e(JSON.stringify(S))};
    if(ghSha)body.sha=ghSha;
    var h=ghHead(c);h['Content-Type']='application/json';
    var r=await fetch(ghUrl(c),{method:'PUT',headers:h,body:JSON.stringify(body)});
    if(r.ok){var j=await r.json();ghSha=j.content.sha;ghTry=0;setG('ok')}
    else if((r.status===409||r.status===422)&&ghTry++<2){
      var g=await fetch(ghUrl(c),{headers:ghHead(c),cache:'no-store'});
      if(g.ok){var gj=await g.json();ghSha=gj.sha;ghDirty=true;setG('busy')}else setG('err',g.status);
    }else{ghDirty=true;setG('err',r.status)}
  }catch(e){ghDirty=true;setG('err')}
  ghBusy=false;
  if(ghDirty&&gstate==='busy'){clearTimeout(ghT);ghT=setTimeout(ghPush,800)}
}
async function ghPull(){
  var c=ghCfg();if(!c)return;
  setG('busy');
  try{
    var r=await fetch(ghUrl(c),{headers:ghHead(c),cache:'no-store'});
    if(r.status===404){ghSha=null;ghDirty=true;await ghPush();return}
    if(!r.ok){setG('err',r.status);return}
    var j=await r.json();ghSha=j.sha;
    var o=JSON.parse(b64d(j.content));
    if(!o||!Array.isArray(o.boxes)){setG('err');return}
    var rat=o.at||0,lat=S.at||0;
    if(rat>lat){
      if(!shade.hidden){setG('ok');return}
      try{localStorage.setItem(LS+'-backup',JSON.stringify(S))}catch(e){}
      S=o;fixS();
      try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      render();if(!hasView)fit();$('ex').hidden=!!S.seen;setG('ok');
    }else if(lat>rat){ghDirty=true;await ghPush()}
    else setG('ok');
  }catch(e){setG('err')}
}
function syncSheet(){
  var c=ghCfg0()||{repo:'shiyo93/QPUC',token:'',path:'carte-savoirs.json'};
  var tip={401:'Le jeton est refusé.',403:'Le jeton n’a pas les droits d’écriture sur ce dépôt.',404:'Dépôt introuvable ou jeton sans accès à ce dépôt.'}[gcode]||'';
  openSheet('<h2>Synchronisation GitHub</h2>'
   +'<p class="note" style="margin:0 0 4px">Tes notes sont enregistrées dans un fichier de ton dépôt. Avec le même réglage sur chaque appareil, elles restent identiques partout.</p>'
   +'<label class="fl" for="g-r">Dépôt (compte/nom)</label><input class="fi" id="g-r" value="'+esc(c.repo)+'" autocomplete="off" autocapitalize="off">'
   +'<label class="fl" for="g-t">Jeton GitHub</label><input class="fi" id="g-t" type="password" value="'+esc(c.token)+'" autocomplete="off">'
   +'<label class="fl" for="g-p">Fichier de notes</label><input class="fi" id="g-p" value="'+esc(c.path)+'" autocomplete="off" autocapitalize="off">'
   +'<p class="note">Tu peux utiliser le même jeton que sur ton site de quiz si ce dépôt est le même (droit « Contents » en lecture et écriture). Il reste dans ce navigateur. Le dépôt est public : le fichier de notes est lisible par quiconque connaît son adresse.</p>'
   +'<p class="note" id="g-m" style="color:var(--danger)">'+esc(tip)+'</p>'
   +'<div class="row"><button class="sb p" id="g-ok" type="button">Enregistrer et synchroniser</button><button class="sb" id="g-tx" type="button">Sauvegarde en texte</button><span class="sp"></span><button class="sb" id="g-no" type="button">Fermer</button></div>'
   +(ghCfg0()?'<div class="row"><button class="sb d" id="g-off" type="button">Se déconnecter de GitHub</button></div>':''));
  $('g-no').onclick=closeSheet;
  $('g-tx').onclick=function(){closeSheet();saveSheet()};
  $('g-ok').onclick=function(){
    var r=val('g-r').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),t=val('g-t').trim(),p=val('g-p').trim()||'carte-savoirs.json';
    if(!/^[\w.-]+\/[\w.-]+$/.test(r)||!t){$('g-m').textContent='Renseigne le dépôt sous la forme compte/nom et colle le jeton.';return}
    try{localStorage.setItem(GHK,JSON.stringify({repo:r,token:t,path:p}))}catch(e){}
    ghSha=null;closeSheet();ghPull();
  };
  var off=$('g-off');
  if(off)armDelete('g-off',function(){try{localStorage.removeItem(GHK)}catch(e){}ghSha=null;ghDirty=false;gstate='';status();closeSheet()});
}
if(window.GH_SYNC){
  var bsv=$('b-save');
  bsv.innerHTML='<svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.5 1.5A3.5 3.5 0 0117 18z"/></svg>';
  bsv.setAttribute('aria-label','Synchronisation GitHub');bsv.title='Synchronisation GitHub';
  bsv.onclick=function(){syncSheet()};
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&ghCfg()&&!ghDirty&&!ghBusy)ghPull();
  });
}

/* ---------- démarrage ---------- */
var hasView=false;
(function(){
  var raw=null,had=false;
  try{raw=localStorage.getItem(LS)}catch(e){}
  if(raw){try{var o=JSON.parse(raw);if(o&&Array.isArray(o.boxes)){S=o;had=true}}catch(e){}}
  if(!had)S=seed();
  fixS();
  var vv=null;try{vv=JSON.parse(localStorage.getItem(LS+'-view'))}catch(e){}
  render();
  if(vv&&vv.k){V=vv;hasView=true;apply()}else fit();
  $('ex').hidden=!!S.seen;
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){lines();if(!hasView)fit()});
  if(window.GH_SYNC&&ghCfg())ghPull();
})();
function takeRemote(str){
  try{
    var o=JSON.parse(str);if(!o||!Array.isArray(o.boxes))return;
    S=o;fixS();
    try{localStorage.setItem(LS,str)}catch(e){}
    render();$('ex').hidden=!!S.seen;if(!hasView)fit();
  }catch(e){}
}
(async function(){
  var db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){}
  if(!db)return;
  ref=db.doc('carte/principale');
  var first=true;
  ref.onSnapshot(function(snap){
    if(first&&snap.metadata.fromCache)return;
    if(snap.metadata.hasPendingWrites)return;
    var d=snap.exists?snap.data():null;
    if(first){
      first=false;online=true;
      if(d&&d.data)takeRemote(d.data);else{dirty=true;flush()}
      status();return;
    }
    if(d&&d.data&&!dirty&&!saving&&shade.hidden&&d.data!==JSON.stringify(S))takeRemote(d.data);
  },function(){online=false;status()});
})();
